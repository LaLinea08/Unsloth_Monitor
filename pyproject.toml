[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "unsloth-monitor"
version = "0.1.0.dev0"
description = "A passive Linux terminal companion for Unsloth"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
unsloth-monitor = "unsloth_monitor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unsloth_monitor = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
